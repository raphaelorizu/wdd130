<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <caption>My Favorite Devotionals</caption>
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Speaker 1</td>
              <td>Title 1</td>
              <td>Location 1</td>
              <td>2020</td>
            </tr>
            <tr>
              <td>Speaker 2</td>
              <td>Title 2</td>
              <td>Location 2</td>
              <td>2021</td>
            </tr>
            <tr>
              <td>Speaker 3</td>
              <td>Title 3</td>
              <td>Location 3</td>
              <td>2022</td>
            </tr>
          </tbody>
        </table>

        <form action="#" method="post">
          <h2>Add Another Devotional</h2>

          <label for="speaker">Speaker</label>
          <input type="text" id="speaker" name="speaker" required>

          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>

          <label for="location">Location</label>
          <input type="text" id="location" name="location" required>

          <label for="year">Year</label>
          <input type="number" id="year" name="year" min="1900" max="2100" required>

          <button type="submit">Add Devotional</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
