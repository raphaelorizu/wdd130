<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background: #E8ECED;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
        }

        .frame {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 30px;
            border: 6px solid #000000;
            border-radius: 25px;
            background-image: url("images/christus.webp");
            background-size: cover;
            background-position: center;
            text-align: center;
            color: #FFFFFF;
        }

        h2 {
            font-size: 28px;
            font-weight: normal;
            margin: 0 0 15px;
        }

        .row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .row img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 4px solid #FFFFFF;
            border-radius: 50%;
            transition: border-color 0.3s;
        }

        .presidency img {
            width: 100px;
            height: 100px;
        }

        .presidency img.center {
            width: 120px;
            height: 120px;
        }

        .row img:hover {
            border-color: #FFD783;
        }
    </style>
</head>
<body>
    <div class="frame">
        <h2>First Presidency</h2>
        <div class="row presidency">
            <img src="images/eyring.webp" alt="Henry B. Eyring">
            <img class="center" src="images/oaks.webp" alt="Dallin H. Oaks">
            <img src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
        </div>

        <h2>Quorum of the Twelve Apostles</h2>
        <div class="row">
            <img src="images/anderson.webp" alt="Neil L. Andersen">
            <img src="images/bednar.webp" alt="David A. Bednar">
            <img src="images/christofferson.webp" alt="D. Todd Christofferson">
            <img src="images/cook.webp" alt="Quentin L. Cook">
        </div>
        <div class="row">
            <img src="images/rasband.webp" alt="Ronald A. Rasband">
            <img src="images/stevenson.webp" alt="Gary E. Stevenson">
            <img src="images/renlund.webp" alt="Dale G. Renlund">
            <img src="images/gilbert.webp" alt="Clark G. Gilbert">
        </div>
        <div class="row">
            <img src="images/soares.webp" alt="Ulisses Soares">
            <img src="images/gong.webp" alt="Gerrit W. Gong">
            <img src="images/kearon.webp" alt="Patrick Kearon">
            <img src="images/causse.webp" alt="Gérald Caussé">
        </div>
    </div>
</body>
</html>
